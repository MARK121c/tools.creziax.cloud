<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تنزيل الفيديوهات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 min-h-screen font-cairo text-white">

    <!-- ===== الهيدر ===== -->
    <header class="pt-10 pb-6 text-center select-none">
        <div class="inline-flex items-center gap-3 mb-3">
            <span class="text-5xl">🎬</span>
            <h1 class="text-4xl md:text-5xl font-extrabold bg-gradient-to-l from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                أداة تنزيل الفيديوهات
            </h1>
        </div>
        <p class="text-slate-400 text-lg">حمّل فيديوهاتك المفضلة بأعلى جودة من يوتيوب وتيك توك وإنستقرام</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 pb-16">

        <!-- ===== تبويبات المنصات ===== -->
        <div class="flex justify-center gap-3 mb-8" id="platformTabs">
            <button class="platform-tab active" data-platform="youtube" onclick="switchPlatform('youtube')">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                يوتيوب
            </button>
            <button class="platform-tab" data-platform="tiktok" onclick="switchPlatform('tiktok')">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
                تيك توك
            </button>
            <button class="platform-tab" data-platform="instagram" onclick="switchPlatform('instagram')">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                إنستقرام
            </button>
        </div>

        <!-- ===== كارت الإدخال الرئيسي ===== -->
        <div class="glass-card rounded-2xl p-6 md:p-8 mb-6">
            <!-- حقل الرابط -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-300 mb-2">🔗 رابط الفيديو</label>
                <div class="flex gap-2">
                    <input type="text" id="urlInput"
                        placeholder="الصق رابط الفيديو هنا..."
                        class="flex-1 bg-slate-800/60 border border-slate-600/50 rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/70 focus:border-transparent transition-all text-base">
                    <button id="pasteBtn" onclick="pasteUrl()"
                        class="bg-slate-700/80 hover:bg-slate-600 rounded-xl px-4 py-3.5 transition-all hover:scale-105 active:scale-95 text-lg" title="لصق من الحافظة">
                        📋
                    </button>
                </div>
            </div>

            <!-- زر جلب المعلومات -->
            <button id="fetchBtn" onclick="fetchInfo()"
                class="w-full bg-gradient-to-l from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-xl px-6 py-3.5 font-bold text-base transition-all hover:shadow-lg hover:shadow-purple-500/25 active:scale-[0.98] flex items-center justify-center gap-2">
                <span id="fetchBtnText">🔍 جلب معلومات الفيديو</span>
                <div id="fetchSpinner" class="hidden spinner"></div>
            </button>

            <!-- رسالة الخطأ -->
            <div id="errorMsg" class="hidden mt-4 bg-red-500/15 border border-red-500/30 rounded-xl p-4 text-red-300 text-sm flex items-start gap-2">
                <span class="text-lg">⚠️</span>
                <span id="errorText"></span>
            </div>
        </div>

        <!-- ===== كارت معلومات الفيديو (مخفي مبدئياً) ===== -->
        <div id="videoInfoCard" class="hidden glass-card rounded-2xl p-6 md:p-8 mb-6 slide-up">

            <!-- معلومات الفيديو -->
            <div class="flex flex-col sm:flex-row gap-4 mb-6">
                <div class="relative flex-shrink-0">
                    <img id="videoThumb" src="" alt="" class="w-full sm:w-52 h-32 object-cover rounded-xl shadow-lg">
                    <span id="videoDurationBadge" class="absolute bottom-2 left-2 bg-black/80 text-white text-xs px-2 py-1 rounded-md font-mono"></span>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 id="videoTitle" class="font-bold text-lg leading-tight mb-2 line-clamp-2"></h3>
                    <p id="videoChannel" class="text-slate-400 text-sm flex items-center gap-1">
                        <span>👤</span>
                        <span id="channelName"></span>
                    </p>
                </div>
            </div>

            <hr class="border-slate-700/50 mb-5">

            <!-- اختيار الجودة -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-300 mb-2">📐 جودة التحميل</label>
                <select id="qualitySelect"
                    class="w-full bg-slate-800/60 border border-slate-600/50 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500/70 transition-all cursor-pointer">
                </select>
            </div>

            <!-- ===== قسم القص - يوتيوب فقط ===== -->
            <div id="trimmerSection" class="hidden mb-5">
                <div class="flex items-center gap-3 mb-3">
                    <label class="toggle-switch">
                        <input type="checkbox" id="enableTrim" onchange="toggleTrimInputs()">
                        <span class="toggle-slider"></span>
                    </label>
                    <label for="enableTrim" class="text-sm font-semibold text-slate-300 cursor-pointer">✂️ قص جزء معين من الفيديو</label>
                </div>
                <div id="trimInputs" class="hidden grid grid-cols-2 gap-4 mt-3 p-4 bg-slate-800/40 rounded-xl border border-slate-700/40">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1.5">⏱️ وقت البداية</label>
                        <input type="text" id="startTime" placeholder="00:00:00"
                            class="w-full bg-slate-700/50 border border-slate-600/50 rounded-lg px-3 py-2.5 text-white text-center font-mono placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/70 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1.5">⏱️ وقت النهاية</label>
                        <input type="text" id="endTime" placeholder="00:05:00"
                            class="w-full bg-slate-700/50 border border-slate-600/50 rounded-lg px-3 py-2.5 text-white text-center font-mono placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/70 transition-all">
                    </div>
                </div>
            </div>

            <!-- ===== خيارات تيك توك ===== -->
            <div id="tiktokOptions" class="hidden mb-5">
                <div class="flex items-center gap-3">
                    <label class="toggle-switch">
                        <input type="checkbox" id="noWatermark" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <label for="noWatermark" class="text-sm font-semibold text-slate-300 cursor-pointer">💧 تحميل بدون علامة مائية</label>
                </div>
            </div>

            <!-- ===== Carousel إنستقرام ===== -->
            <div id="carouselSection" class="hidden mb-5">
                <label class="block text-sm font-semibold text-slate-300 mb-3">🖼️ اختر العناصر للتحميل</label>
                <div class="flex items-center gap-3 mb-3">
                    <button onclick="selectAllCarousel()" class="text-xs bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/30 text-blue-300 px-3 py-1.5 rounded-lg transition-all">تحديد الكل</button>
                    <button onclick="deselectAllCarousel()" class="text-xs bg-slate-600/30 hover:bg-slate-600/50 border border-slate-500/30 text-slate-300 px-3 py-1.5 rounded-lg transition-all">إلغاء التحديد</button>
                </div>
                <div id="carouselItems" class="grid grid-cols-3 sm:grid-cols-4 gap-3"></div>
            </div>

            <!-- ===== زر التحميل ===== -->
            <button id="downloadBtn" onclick="startDownload()"
                class="w-full mt-2 bg-gradient-to-l from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 rounded-xl px-6 py-4 font-bold text-lg transition-all hover:shadow-lg hover:shadow-emerald-500/25 active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-none">
                <span id="downloadBtnIcon">⬇️</span>
                <span id="downloadBtnText">تحميل الفيديو</span>
                <div id="downloadSpinner" class="hidden spinner"></div>
            </button>

            <!-- شريط التقدم -->
            <div id="progressSection" class="hidden mt-5">
                <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                    <div id="progressBar" class="progress-bar-gradient h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
                <p id="progressText" class="text-sm text-slate-400 mt-2 text-center"></p>
            </div>

            <!-- رسالة النجاح -->
            <div id="successMsg" class="hidden mt-4 bg-emerald-500/15 border border-emerald-500/30 rounded-xl p-4 text-emerald-300 text-sm text-center">
                <span class="text-2xl block mb-1">✅</span>
                <span>تم التحميل بنجاح! الملف محفوظ في مجلد التنزيلات.</span>
            </div>
        </div>

    </main>

    <!-- ===== الفوتر ===== -->
    <footer class="text-center py-6 text-slate-600 text-sm">
        <p>صُنعت بـ ❤️ | تعمل بمحرك yt-dlp + ffmpeg</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
