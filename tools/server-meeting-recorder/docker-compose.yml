version: '3.8'

services:
  meeting-recorder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creziax_meeting_recorder
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ENVIRONMENT=production
    env_file:
      - .env
    volumes:
      - ./recordings:/app/recordings
      - ./logs:/app/logs
    # High shared memory is mandatory for Chromium in Docker to prevent crashes
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
